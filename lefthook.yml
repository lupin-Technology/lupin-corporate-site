pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,mjs,ts,tsx,json,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,ts,tsx}"
      run: npx eslint {staged_files}
    lint-css:
      glob: "*.css"
      run: npx stylelint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: npx tsc --noEmit

pre-push:
  commands:
    build:
      run: npm run build

commit-msg:
  commands:
    prefix-check:
      run: bash scripts/check-commit-msg.sh {1}
